name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # starts a brand-new Linux virtual machine for this run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
